<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Heat Gauge</title>
<!-- Generated from logo-mark.png, cropped to the gauge/bull — the wordmark is
     unreadable at 32px. See the crop step in the handoff. -->
<link rel="icon" href="src/favicon.ico?v=46" sizes="any">
<link rel="icon" href="src/favicon-32.png?v=46" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="src/apple-touch-icon.png?v=46">
<link rel="stylesheet" href="src/styles.css?v=30">
<link rel="stylesheet" href="src/dashboard.css?v=46">
<link rel="stylesheet" href="src/auth.css?v=46">
</head>
<body>
<div id="root"></div>

<!-- Firebase (compat build — matches the global `firebase.*` style used in src/) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<!-- Config + initializeApp. Plain JS on purpose: it must run before any Babel
     module renders, and it holds the security rules to publish. -->
<script src="src/firebase.js?v=41"></script>
<!-- Landing background effect. Standalone vanilla JS + Canvas 2D; exposes
     window.GridScan.mount(canvasOrCanvases). No framework, no build step. -->
<script src="src/gridscan.js?v=30"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<!-- TradingView Advanced Chart widget (free, no API key) — supports studies_overrides
     so the indicator colors saved in Settings actually apply. -->
<script src="https://s3.tradingview.com/tv.js"></script>

<script type="text/babel" src="src/scoring.jsx?v=51" data-plugins="transform-react-jsx-source" data-filename="src/scoring.jsx"></script>
<script type="text/babel" src="src/v2schema.jsx?v=39" data-plugins="transform-react-jsx-source" data-filename="src/v2schema.jsx"></script>
<script type="text/babel" src="src/metrics.jsx?v=30" data-plugins="transform-react-jsx-source" data-filename="src/metrics.jsx"></script>
<script type="text/babel" src="src/chartprefs.jsx?v=30" data-plugins="transform-react-jsx-source" data-filename="src/chartprefs.jsx"></script>
<!-- Shared manual-override layer (window.ovr*). Firestore-backed; replaced the
     per-browser localStorage tag/behavior edits. Attaches its own auth listener,
     so it only needs to load before anything renders. -->
<script type="text/babel" src="src/overrides.jsx?v=42" data-plugins="transform-react-jsx-source" data-filename="src/overrides.jsx"></script>
<!-- Shared fullscreen overlay (window.HgOverlay). Must load BEFORE shots/Playbook —
     every fullscreen viewer renders through it. -->
<script type="text/babel" src="src/overlay.jsx?v=40" data-plugins="transform-react-jsx-source" data-filename="src/overlay.jsx"></script>
<!-- Usernames + avatars. Must load BEFORE Auth/Notes/shots — they call
     window.pfUseProfile / window.Avatar / window.PfUsernameField at render time. -->
<script type="text/babel" src="src/Profile.jsx?v=30" data-plugins="transform-react-jsx-source" data-filename="src/Profile.jsx"></script>
<script type="text/babel" src="src/Auth.jsx?v=46" data-plugins="transform-react-jsx-source" data-filename="src/Auth.jsx"></script>
<script type="text/babel" src="src/Notes.jsx?v=30" data-plugins="transform-react-jsx-source" data-filename="src/Notes.jsx"></script>
<script type="text/babel" src="src/shots.jsx?v=40" data-plugins="transform-react-jsx-source" data-filename="src/shots.jsx"></script>
<!-- Shared per-user grades (window.gr*). Owns window.getGrade — the AVERAGED
     desk grade that Top Movers, the Playbook and folder criteria all read.
     Loads after Profile, like shots, so its grader tooltips resolve live
     handles through pfSubscribe. -->
<script type="text/babel" src="src/grades.jsx?v=35" data-plugins="transform-react-jsx-source" data-filename="src/grades.jsx"></script>
<script type="text/babel" src="src/Gauge.jsx?v=51" data-plugins="transform-react-jsx-source" data-filename="src/Gauge.jsx"></script>
<script type="text/babel" src="src/Strip.jsx?v=30" data-plugins="transform-react-jsx-source" data-filename="src/Strip.jsx"></script>
<script type="text/babel" src="src/DayDetail.jsx?v=49" data-plugins="transform-react-jsx-source" data-filename="src/DayDetail.jsx"></script>
<script type="text/babel" src="src/Calendar.jsx?v=30" data-plugins="transform-react-jsx-source" data-filename="src/Calendar.jsx"></script>
<script type="text/babel" src="src/EntryForm.jsx?v=30" data-plugins="transform-react-jsx-source" data-filename="src/EntryForm.jsx"></script>
<script type="text/babel" src="src/Import.jsx?v=30" data-plugins="transform-react-jsx-source" data-filename="src/Import.jsx"></script>
<script type="text/babel" src="src/Insights.jsx?v=38" data-plugins="transform-react-jsx-source" data-filename="src/Insights.jsx"></script>
<script type="text/babel" src="src/Overview.jsx?v=51" data-plugins="transform-react-jsx-source" data-filename="src/Overview.jsx"></script>
<script type="text/babel" src="src/Settings.jsx?v=42" data-plugins="transform-react-jsx-source" data-filename="src/Settings.jsx"></script>
<script type="text/babel" src="src/Playbook.jsx?v=46" data-plugins="transform-react-jsx-source" data-filename="src/Playbook.jsx"></script>
<script type="text/babel" src="src/App.jsx?v=49" data-plugins="transform-react-jsx-source" data-filename="src/App.jsx"></script>
<script type="text/babel" src="src/Tweaks.jsx?v=50" data-plugins="transform-react-jsx-source" data-filename="src/Tweaks.jsx"></script>

<script type="text/babel" data-plugins="transform-react-jsx-source" data-filename="inline-root">
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<window.Root />);
</script>
</body>
</html>
